name: Tests

on:
  workflow_dispatch:
  push:
    branches: [master, 'feature/*', 'test/*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: ${{ github.workspace }}/build/tests

jobs:
  test-linux:
    name: Test Linux, ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libopenal-dev

    - name: Create Build Environment
      run: cmake -E make_directory "${{ env.BUILD_DIR }}"

    - name: Configure CMake
      shell: bash
      working-directory: ${{ env.BUILD_DIR }}
      run: cmake "$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBuildTests=ON -DBuildMVMP=OFF -DBuildMVDED=OFF -DBuildMVSDK=OFF -DUseInternalMiniZip=ON

    - name: Build All Tests
      working-directory: ${{ env.BUILD_DIR }}
      shell: bash
      run: cmake --build . --parallel $(nproc)

    - name: Run Tests
      working-directory: ${{ env.BUILD_DIR }}/tests
      shell: bash
      run: ctest --output-on-failure --verbose

  test-windows:
    name: Test Windows, ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Create Build Environment
      run: cmake -E make_directory "${{ env.BUILD_DIR }}"

    - name: Configure CMake
      shell: bash
      working-directory: ${{ env.BUILD_DIR }}
      run: cmake "$GITHUB_WORKSPACE" -A x64 -DBuildTests=ON -DBuildMVMP=OFF -DBuildMVDED=OFF -DBuildMVSDK=OFF -DUseInternalMiniZip=ON

    - name: Build All Tests
      working-directory: ${{ env.BUILD_DIR }}
      shell: cmd
      run: cmake --build . --config ${{ matrix.build_type }} --parallel

    - name: Run Tests
      working-directory: ${{ env.BUILD_DIR }}/tests
      shell: bash
      run: ctest -C ${{ matrix.build_type }} --output-on-failure --verbose

  # Builds the whole engine and runs the unit tests plus the smoke tests,
  # which start jk2mvded (31 bots on a generated map) and a headless jk2mvmp
  # (SDL offscreen + Mesa llvmpipe) on a stub game directory.
  engine-smoke:
    name: Engine build + smoke tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3 libsdl2-dev libgl-dev libopenal-dev \
          libjpeg-dev libpng-dev libgl1-mesa-dri libegl1 libegl-mesa0

    - name: Configure CMake
      run: cmake -S "$GITHUB_WORKSPACE" -B "${{ env.BUILD_DIR }}" -DCMAKE_BUILD_TYPE=Release -DBuildTests=ON -DSmokeTests=ON -DUseInternalMiniZip=ON

    - name: Build
      run: cmake --build "${{ env.BUILD_DIR }}" --parallel $(nproc)

    - name: Run Tests
      working-directory: ${{ env.BUILD_DIR }}/tests
      run: ctest --output-on-failure

    - uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: smoke-logs
        path: |
          ${{ env.BUILD_DIR }}/tests/smoke/*/server.log
          ${{ env.BUILD_DIR }}/tests/smoke/*/client.log
          ${{ env.BUILD_DIR }}/tests/smoke/*/base/screenshots/*.tga

  test-results:
    name: Test Results Summary
    runs-on: ubuntu-22.04
    needs: [test-linux, test-windows, engine-smoke]
    if: always()
    steps:
    - name: Check Test Status
      run: |
        if [[ "${{ needs.test-linux.result }}" == "success" ]] && [[ "${{ needs.test-windows.result }}" == "success" ]] && [[ "${{ needs.engine-smoke.result }}" == "success" ]]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Some tests failed!"
          echo "Linux: ${{ needs.test-linux.result }}"
          echo "Windows: ${{ needs.test-windows.result }}"
          echo "Engine + smoke: ${{ needs.engine-smoke.result }}"
          exit 1
        fi
